name: CI Pipeline

# Corre ante Pull Requests hacia develop y main, y ante cualquier push a las
# ramas de hotfix (hotfix/**), main y develop (verificacion posterior al merge).
on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "main", "develop", "hotfix/**" ]

jobs:
  build-and-test:
    name: Calidad (formato, linter, tests, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ics

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ics/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Linter (ESLint)
        run: npm run lint

      - name: Tests unitarios (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build

  e2e:
    name: Integracion (Cypress E2E)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Tests E2E (Cypress)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
